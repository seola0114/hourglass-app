<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>모래시계</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; height: 100dvh;
            overflow: hidden; position: fixed; top: 0; left: 0;
            background:
                radial-gradient(ellipse 60% 22% at 50% 56%, rgba(92,224,255,0.16) 0%, transparent 58%),
                radial-gradient(ellipse 78% 24% at 36% 89%, rgba(255,175,210,0.48) 0%, transparent 60%),
                radial-gradient(ellipse 68% 20% at 78% 94%, rgba(255,150,196,0.35) 0%, transparent 58%),
                radial-gradient(ellipse 90% 18% at 50% 102%, rgba(255,218,190,0.38) 0%, transparent 65%),
                linear-gradient(180deg, #173f6a 0%, #235b88 22%, #327aa1 45%, #5d8eaa 66%, #8f8fb0 82%, #d19aad 100%);
            touch-action: none; user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body::before {
            content: ''; position: fixed; inset: 0; pointer-events: none;
            background:
                linear-gradient(104deg, transparent 30%, rgba(168,228,255,0.10) 40%, rgba(224,255,248,0.12) 47%, rgba(255,220,200,0.10) 56%, transparent 68%),
                radial-gradient(circle at 50% 47%, transparent 0%, transparent 42%, rgba(12,28,64,0.18) 78%, rgba(8,12,28,0.34) 100%),
                linear-gradient(180deg, rgba(255,255,255,0.08) 0%, transparent 22%, rgba(40,90,130,0.12) 100%);
            mix-blend-mode: screen;
        }
        body::after {
            content: ''; position: fixed; inset: 0; pointer-events: none;
            background-image:
                radial-gradient(circle, rgba(255,255,255,0.9) 1px, transparent 1.5px),
                radial-gradient(circle, rgba(255,240,200,0.7) 0.8px, transparent 1.5px),
                radial-gradient(circle, rgba(220,230,255,0.6) 0.6px, transparent 1.2px);
            background-size: 280px 280px, 190px 190px, 130px 130px;
            background-position: 40px 70px, 160px 30px, 90px 180px;
            opacity: 0.72;
        }
        #grain {
            position: fixed; inset: 0; pointer-events: none; z-index: 2;
            opacity: 0.11;
            background-image:
                repeating-radial-gradient(circle at 12% 18%, rgba(255,255,255,0.18) 0 0.7px, transparent 0.8px 2.4px),
                repeating-linear-gradient(78deg, rgba(255,255,255,0.05) 0 1px, transparent 1px 4px);
            background-size: 180px 180px, 220px 220px;
            mix-blend-mode: soft-light;
        }
        canvas { display: block; position: fixed; top: 0; left: 0; touch-action: none; }
        #ui {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
            display: flex; flex-direction: column; align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        #status {
            margin-top: 40px; color: rgba(245,235,210,0.75);
            font-size: 12px; font-weight: 600; letter-spacing: 2px;
            text-shadow: 0 1px 4px rgba(40,40,80,0.5);
        }
        #status.done { color: rgba(255,230,170,0.95); }
        #timer {
            margin-top: 8px; color: rgba(255,240,210,0.85);
            font-size: 24px; font-weight: 300;
            font-family: ui-monospace, 'SF Mono', monospace;
            min-height: 30px;
            text-shadow: 0 1px 4px rgba(40,40,80,0.5);
        }
        #hint {
            position: fixed; bottom: 32px; left: 0; width: 100%;
            text-align: center; color: rgba(240,225,210,0.55);
            font-size: 11px;
            text-shadow: 0 1px 4px rgba(40,40,80,0.4);
        }
        #panel {
            position: fixed; top: 14px; right: 14px; z-index: 20;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: rgba(245,235,215,0.9);
            display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
        }
        #panel-body {
            padding: 16px 18px;
            border-radius: 16px;
            background: rgba(18,35,62,0.28);
            backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%);
            box-shadow: 0 4px 24px rgba(20,25,60,0.35), inset 0 0 0 1px rgba(180,245,255,0.18);
            min-width: 220px;
        }
        #panel-body label {
            display: block; font-size: 11px; font-weight: 600;
            letter-spacing: 1px; margin-bottom: 14px;
        }
        #panel-body label:last-child { margin-bottom: 0; }
        #panel-body .row {
            display: flex; justify-content: space-between; align-items: baseline;
            margin-bottom: 6px;
        }
        #panel-body .val {
            font-family: ui-monospace, 'SF Mono', monospace;
            font-weight: 400; font-size: 11px;
            color: rgba(255,225,170,0.95); letter-spacing: 0;
        }
        #panel-body input[type=range] {
            width: 100%; accent-color: rgba(255,210,150,0.95);
            cursor: pointer;
        }
    </style>
</head>
<body>
<div id="ui">
    <div id="status">대기 중</div>
    <div id="timer"></div>
    <div id="hint">화면을 탭하여 뒤집기</div>
</div>
<div id="grain"></div>
<div id="panel">
    <div id="panel-body">
        <label>
            <div class="row"><span>총 시간</span><span class="val" id="v-duration">60s</span></div>
            <input type="range" min="10" max="180" step="1" value="60" id="s-duration">
        </label>
        <label>
            <div class="row"><span>모래 양</span><span class="val" id="v-sand">100%</span></div>
            <input type="range" min="10" max="100" step="5" value="100" id="s-sand">
        </label>
        <label>
            <div class="row"><span>입자 크기</span><span class="val" id="v-psize">0.0070</span></div>
            <input type="range" min="20" max="200" step="1" value="70" id="s-psize">
        </label>
        <label>
            <div class="row"><span>셀당 입자 수</span><span class="val" id="v-ppc">10</span></div>
            <input type="range" min="1" max="20" step="1" value="10" id="s-ppc">
        </label>
        <label>
            <div class="row"><span>안식각 (slide)</span><span class="val" id="v-slide">3</span></div>
            <input type="range" min="1" max="6" step="1" value="3" id="s-slide">
        </label>
    </div>
</div>
<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"
    }
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ── Config ──
const HG_H = 4, MAX_R = 0.82, NECK_R = 0.12;
const CELL = 1, STEPS = 3, DONE_DELAY = 3000;
let DURATION = 60;
let SAND_FILL = 1.0; // 0~1: 바닥 bulb를 얼마나 채울지 (1=가득)
let SLIDE_MAX = 3; // 표면 모래가 한 step에 미끄러질 수 있는 최대 셀 수 → 안식각 ↓ (완만한 더미)
const SAND_HEX = [0xFFFFFF,0xFFFDF4,0xFFF8E4,0xF6FBFF,0xFFF1C8,0xF9E7B8,0xFFFFFF,0xFFF6D8];
const SAND_COL = SAND_HEX.map(h => new THREE.Color(h));
let P_SIZE = 0.0070;
let PARTICLES_PER_CELL = 10; // 셀당 입자 N개 → 미세한 가루처럼 연속적인 흐름

// ── State ──
let state = 'IDLE', W, H, dpr;
let gW = 65, gH = 130, cCol, cRow, maxHW, neckHW = 2;
let sand, clr, bnd, mv, colArr;
let t0 = 0, tDone = 0, fc = 0;
let totalSandCount = 0, neckFlowBudget = 0, neckFlowPerSecond = 0;
let prevFlip = false, hasOrient = false;
let flipAnim = -1, flipDur = 0.55;
let particlePos;

// ── UI refs ──
const statusEl = document.getElementById('status');
const timerEl = document.getElementById('timer');
const hintEl = document.getElementById('hint');

// ── Three.js Setup ──
W = window.visualViewport?.width || window.innerWidth;
H = window.visualViewport?.height || window.innerHeight;
dpr = Math.min(window.devicePixelRatio || 1, 2);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x17486e, 0.018);

function makeSceneBackground() {
    const c = document.createElement('canvas');
    c.width = 1024;
    c.height = 1536;
    const ctx = c.getContext('2d');
    const sky = ctx.createLinearGradient(0, 0, 0, c.height);
    sky.addColorStop(0, '#153d68');
    sky.addColorStop(0.28, '#25698f');
    sky.addColorStop(0.55, '#5a92aa');
    sky.addColorStop(0.78, '#928dac');
    sky.addColorStop(1, '#d59aad');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, c.width, c.height);

    for (const cloud of [
        [250, 1280, 360, 'rgba(255,170,206,0.30)'],
        [790, 1350, 430, 'rgba(255,196,210,0.24)'],
        [520, 1460, 520, 'rgba(255,222,194,0.18)'],
        [520, 760, 500, 'rgba(84,227,255,0.12)']
    ]) {
        const g = ctx.createRadialGradient(cloud[0], cloud[1], 0, cloud[0], cloud[1], cloud[2]);
        g.addColorStop(0, cloud[3]);
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, c.width, c.height);
    }

    const vignette = ctx.createRadialGradient(512, 720, 120, 512, 720, 920);
    vignette.addColorStop(0, 'rgba(255,255,255,0)');
    vignette.addColorStop(0.68, 'rgba(10,35,70,0.04)');
    vignette.addColorStop(1, 'rgba(8,18,42,0.32)');
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, c.width, c.height);

    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
}
scene.background = makeSceneBackground();

const camera = new THREE.PerspectiveCamera(24, W / H, 0.1, 100);
camera.position.set(0.15, 0.15, 13);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(W, H);
renderer.setPixelRatio(dpr);
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.88;
document.body.appendChild(renderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(W * dpr, H * dpr), 0.22, 0.55, 0.86);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

// ── Lights ──
scene.add(new THREE.AmbientLight(0xb8c8e8, 0.9));
const dirLight = new THREE.DirectionalLight(0xfff0c8, 1.4);
dirLight.position.set(3, 4, 5);
scene.add(dirLight);
const rimLight = new THREE.DirectionalLight(0x88a8ff, 1.1);
rimLight.position.set(-3, -1, -3);
scene.add(rimLight);
const warmLight = new THREE.PointLight(0xffd890, 1.4, 10);
warmLight.position.set(0, -1, 3);
scene.add(warmLight);
const pileLight = new THREE.PointLight(0xffc45c, 0.75, 3.2);
pileLight.position.set(0, -1.25, 1.2);
scene.add(pileLight);
const topLight = new THREE.PointLight(0xa0c0ff, 0.7, 10);
topLight.position.set(0, 3, 2);
scene.add(topLight);
const aquaLight = new THREE.PointLight(0x63f2ff, 1.1, 6);
aquaLight.position.set(0, 0.75, 1.8);
scene.add(aquaLight);
// 골든 글로우 — 모래시계 내부를 따뜻하게 발광시키는 중심 라이트
const innerGlow = new THREE.PointLight(0xffe0a0, 1.2, 3);
innerGlow.position.set(0, -0.6, 0);
scene.add(innerGlow);

// ── Hourglass Group ──
const hgGroup = new THREE.Group();
hgGroup.rotation.y = -0.08;
scene.add(hgGroup);

// ── Profile (shared by glass mesh and sand simulation) ──
// d in [0, 1]: 0 = neck (center), 1 = top/bottom end
function bulgeRadius(d) {
    const smooth = d * d * (3 - 2 * d);
    const shoulder = Math.sin(smooth * Math.PI * 0.5);
    const taper = 1 - Math.pow(d, 7) * 0.38;
    return NECK_R + (MAX_R - NECK_R) * Math.pow(shoulder, 0.82) * taper;
}

function glassProfile() {
    const pts = [];
    for (let i = 0; i <= 220; i++) {
        const t = i / 220;
        const d = Math.abs(t - 0.5) * 2;
        const r = bulgeRadius(d);
        pts.push(new THREE.Vector2(r, (t - 0.5) * HG_H));
    }
    return pts;
}

// Glass body
const glassGeo = new THREE.LatheGeometry(glassProfile(), 128);
const glassMat = new THREE.MeshPhysicalMaterial({
    color: 0xdffcff,
    transparent: true, opacity: 0.22,
    roughness: 0.05, metalness: 0.0,
    transmission: 0.92, thickness: 0.5,
    attenuationColor: new THREE.Color(0xc6f3ff),
    attenuationDistance: 4.0,
    clearcoat: 0.55, clearcoatRoughness: 0.12,
    iridescence: 0.0,
    ior: 1.45, reflectivity: 0.55,
    envMapIntensity: 0.7,
    specularIntensity: 0.55,
    specularColor: new THREE.Color(0xeaf6ff),
    side: THREE.DoubleSide, depthWrite: false
});
const glassMesh = new THREE.Mesh(glassGeo, glassMat);
glassMesh.renderOrder = 3;
hgGroup.add(glassMesh);

// (innerGlass / rimMesh / glassHighlight 데코 메쉬 제거 — 내부 cone-streak 정리)

// Soft aqua glow inside the upper glass, matching the luminous jellyfish reference.
const upperGlow = new THREE.Mesh(
    new THREE.SphereGeometry(0.72, 40, 24),
    new THREE.MeshBasicMaterial({
        color: 0x64f6ff, transparent: true, opacity: 0.006,
        blending: THREE.AdditiveBlending, depthWrite: false
    })
);
upperGlow.position.y = 0.82;
upperGlow.scale.set(1.18, 0.72, 1.18);
hgGroup.add(upperGlow);

// Frame: iridescent warm-gold metal (caps, posts, beads, finial)
const frameMat = new THREE.MeshPhysicalMaterial({
    color: 0xe8fbff,
    transparent: true,
    opacity: 0.28,
    metalness: 0.0,
    roughness: 0.02,
    transmission: 0.84,
    thickness: 0.5,
    attenuationColor: new THREE.Color(0xc8fbff),
    attenuationDistance: 2.4,
    clearcoat: 1.0,
    clearcoatRoughness: 0.02,
    iridescence: 1.0,
    iridescenceIOR: 1.45,
    iridescenceThicknessRange: [160, 760],
    emissive: 0x79eaff,
    emissiveIntensity: 0.05,
    envMapIntensity: 1.4,
    reflectivity: 0.85,
    depthWrite: false
});
const FRAME_R = MAX_R + 0.18;
const CAP_THK = 0.16;

// Top & bottom plates
for (const ySign of [-1, 1]) {
    const y = ySign * (HG_H / 2 + CAP_THK / 2 + 0.02);
    const plate = new THREE.Mesh(
        new THREE.CylinderGeometry(FRAME_R, FRAME_R * 0.95, CAP_THK, 96),
        frameMat
    );
    plate.position.y = y;
    hgGroup.add(plate);
    // rounded outer rim
    const rim = new THREE.Mesh(
        new THREE.TorusGeometry(FRAME_R, 0.035, 18, 112),
        frameMat
    );
    rim.position.y = y + ySign * (CAP_THK / 2 - 0.01);
    rim.rotation.x = Math.PI / 2;
    hgGroup.add(rim);
}

// (기둥 제거됨 — plate만 유지)

// Top finial: small transparent bead
const finialY = HG_H / 2 + CAP_THK + 0.08;
const finial = new THREE.Mesh(
    new THREE.SphereGeometry(0.045, 32, 24),
    frameMat
);
finial.position.y = finialY + 0.04;
hgGroup.add(finial);

const stem = new THREE.Mesh(
    new THREE.CylinderGeometry(0.012, 0.012, 0.06, 18),
    frameMat
);
stem.position.y = finialY;
hgGroup.add(stem);

// ── Crescent moon emblem inside bottom bulb ──
function makeMoonTexture() {
    const c = document.createElement('canvas');
    c.width = c.height = 256;
    const ctx = c.getContext('2d');
    // outer warm halo
    const grad = ctx.createRadialGradient(128, 128, 10, 128, 128, 128);
    grad.addColorStop(0,   'rgba(255,235,180,0.85)');
    grad.addColorStop(0.35,'rgba(255,210,140,0.45)');
    grad.addColorStop(0.7, 'rgba(255,190,120,0.15)');
    grad.addColorStop(1,   'rgba(255,180,100,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 256, 256);
    // crescent: main disc minus offset disc
    ctx.save();
    ctx.translate(128, 128);
    ctx.rotate(-Math.PI * 0.15);
    const moonGrad = ctx.createRadialGradient(0, 0, 10, 0, 0, 56);
    moonGrad.addColorStop(0,   'rgba(255,250,220,1)');
    moonGrad.addColorStop(0.7, 'rgba(255,235,180,0.95)');
    moonGrad.addColorStop(1,   'rgba(255,210,140,0.8)');
    ctx.fillStyle = moonGrad;
    ctx.beginPath();
    ctx.arc(0, 0, 56, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(22, -8, 52, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
}
const moonMat = new THREE.SpriteMaterial({
    map: makeMoonTexture(),
    transparent: true, opacity: 0.92,
    blending: THREE.AdditiveBlending, depthWrite: false
});
const moonSprite = new THREE.Sprite(moonMat);
moonSprite.scale.set(0.6, 0.6, 1);
moonSprite.position.set(0, -0.85, 0);
hgGroup.add(moonSprite);

// ── Background twinkling stars (scattered in scene, outside hourglass) ──
const BG_STAR_N = 45;
const bgStarGeo = new THREE.BufferGeometry();
const bgStarPos = new Float32Array(BG_STAR_N * 3);
const bgStarPhase = new Float32Array(BG_STAR_N);
for (let i = 0; i < BG_STAR_N; i++) {
    // ring/sphere around hourglass, biased outward
    const theta = Math.random() * Math.PI * 2;
    const phi = (Math.random() - 0.5) * Math.PI * 0.9;
    const radius = 3.2 + Math.random() * 2.8;
    bgStarPos[i * 3]     = Math.cos(theta) * Math.cos(phi) * radius;
    bgStarPos[i * 3 + 1] = Math.sin(phi) * radius * 0.85;
    bgStarPos[i * 3 + 2] = Math.sin(theta) * Math.cos(phi) * radius - 1.5;
    bgStarPhase[i] = Math.random() * Math.PI * 2;
}
bgStarGeo.setAttribute('position', new THREE.BufferAttribute(bgStarPos, 3));
const bgStarMat = new THREE.PointsMaterial({
    map: makeDotTexture(),
    color: 0xfff8dc, size: 0.038, transparent: true, opacity: 0.48,
    blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
});
const bgStars = new THREE.Points(bgStarGeo, bgStarMat);
scene.add(bgStars);

function makeDotTexture() {
    const c = document.createElement('canvas');
    c.width = c.height = 128;
    const ctx = c.getContext('2d');
    const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 58);
    grad.addColorStop(0, 'rgba(255,255,235,1)');
    grad.addColorStop(0.32, 'rgba(118,246,255,0.42)');
    grad.addColorStop(1, 'rgba(118,246,255,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 128, 128);
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
}

const DUST_N = 360;
const dustGeo = new THREE.BufferGeometry();
const dustPos = new Float32Array(DUST_N * 3);
const dustPhase = new Float32Array(DUST_N);
for (let i = 0; i < DUST_N; i++) {
    const theta = Math.random() * Math.PI * 2;
    const radius = 0.45 + Math.random() * 2.1;
    dustPos[i * 3] = Math.cos(theta) * radius;
    dustPos[i * 3 + 1] = -2.0 + Math.random() * 4.2;
    dustPos[i * 3 + 2] = Math.sin(theta) * radius - 0.3;
    dustPhase[i] = Math.random() * Math.PI * 2;
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dustMat = new THREE.PointsMaterial({
    map: makeDotTexture(),
    color: 0xcdfcff,
    size: 0.035,
    transparent: true,
    opacity: 0.38,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    sizeAttenuation: true
});
const dustPoints = new THREE.Points(dustGeo, dustMat);
scene.add(dustPoints);

// ── Sand Grid Init ──
cCol = gW >> 1;
cRow = gH >> 1;
maxHW = cCol;
const n = gW * gH;
sand = new Uint8Array(n);
clr = new Uint8Array(n);
bnd = new Uint8Array(n);
mv = new Uint8Array(n);
colArr = Array.from({ length: gW }, (_, i) => i);

function hw2(row) {
    const d = Math.abs(row / (gH - 1) - 0.5) * 2;
    const r = bulgeRadius(d);
    const norm = (r - NECK_R) / (MAX_R - NECK_R);
    return Math.max(neckHW, Math.floor(neckHW + (maxHW - neckHW) * norm));
}
function radius3D(row) {
    const d = Math.abs(row / (gH - 1) - 0.5) * 2;
    return bulgeRadius(d);
}

for (let r = 0; r < gH; r++) {
    const w = hw2(r);
    const d = Math.abs(r / (gH - 1) - 0.5) * 2;
    const inBulb = d <= 0.82; // 어깨 외곽(좁아지는 rim) 제외 → 모래가 갇히는 자리 자체를 제거
    for (let c = 0; c < gW; c++)
        bnd[r * gW + c] = (inBulb && Math.abs(c - cCol) <= w) ? 1 : 0;
}

// Pre-compute 3D positions for each grid cell — PARTICLES_PER_CELL particles per cell with jitter.
// Spread는 입자 크기(P_SIZE)에 비례. 작은 입자는 셀 중심에 좁게 모이고, 큰 입자는 더 넓게 퍼져
// 입자 사이 간격이 크기에 비례해 보이도록 한다.
function buildParticlePositions() {
    particlePos = new Float32Array(n * PARTICLES_PER_CELL * 3);
    const yStep = HG_H / (gH - 1);
    // 0.005를 기준 크기로 spread를 0.55~1.5x 사이에서 스케일
    const sizeRatio = Math.min(P_SIZE / 0.005, 2.5);
    const spreadFactor = 0.5 + sizeRatio * 0.4; // P_SIZE=0.002→0.66, 0.005→0.9, 0.01→1.3, 0.02→1.5
    for (let r = 0; r < gH; r++) {
        const yCenter = (0.5 - r / (gH - 1)) * HG_H;
        const r3d = radius3D(r) * 0.82;
        const hw = hw2(r) || 1;
        const xStep = r3d / hw;
        const spreadX = xStep * 0.9 * spreadFactor;
        const spreadY = yStep * 0.9 * spreadFactor;
        for (let c = 0; c < gW; c++) {
            const offset = c - cCol;
            const xCenter = (offset / hw) * r3d;
            for (let p = 0; p < PARTICLES_PER_CELL; p++) {
                const idx = ((r * gW + c) * PARTICLES_PER_CELL + p) * 3;
                const h1 = Math.sin(r * 127.1 + c * 311.7 + p * 71.3) * 43758.5453;
                const h2 = Math.sin(r * 71.3 + c * 113.5 + p * 217.7) * 43758.5453;
                const h3 = Math.sin(r * 213.9 + c * 79.1 + p * 309.5) * 43758.5453;
                const jx = ((h1 - Math.floor(h1)) - 0.5) * spreadX;
                const jy = ((h2 - Math.floor(h2)) - 0.5) * spreadY;
                const zN = (h3 - Math.floor(h3)) * 2 - 1;
                const xPos = xCenter + jx;
                const yPos = yCenter + jy;
                const zMax = Math.sqrt(Math.max(0, r3d * r3d - xPos * xPos));
                particlePos[idx] = xPos;
                particlePos[idx + 1] = yPos;
                particlePos[idx + 2] = zN * zMax;
            }
        }
    }
}
buildParticlePositions();

function fillBottom() {
    sand.fill(0);
    const startBase = cRow + 2;
    const rows = gH - startBase;
    const startRow = startBase + Math.floor((1 - SAND_FILL) * rows);
    for (let r = startRow; r < gH; r++) {
        for (let c = 0; c < gW; c++) {
            const i = r * gW + c;
            if (bnd[i]) { sand[i] = 1; clr[i] = (Math.random() * SAND_HEX.length) | 0; }
        }
    }
}
fillBottom();
totalSandCount = sand.reduce((a, b) => a + b, 0);
// Buffer는 가장 채워졌을 때(SAND_FILL=1) 기준으로 크기 잡음 — 이후 슬라이더로 늘려도 안전.
const maxSandCount = totalSandCount;
neckFlowPerSecond = totalSandCount / DURATION;

// ── Sand InstancedMesh ──
let sandGeo = new THREE.IcosahedronGeometry(P_SIZE, 0);
const sandMat = new THREE.MeshPhysicalMaterial({
    color: 0xffffff, roughness: 0.42, metalness: 0.0,
    sheen: 0.6, sheenColor: new THREE.Color(0xffffff),
    sheenRoughness: 0.45,
    emissive: 0xfff6d8, emissiveIntensity: 0.85,
    envMapIntensity: 0.6
});

function makeSandMoundGeometry() {
    const pts = [];
    pts.push(new THREE.Vector2(0, -1.64));
    pts.push(new THREE.Vector2(0.68, -1.64));
    for (let i = 0; i <= 48; i++) {
        const t = i / 48;
        const x = 0.68 * Math.pow(1 - t, 0.82);
        const y = -1.64 + 1.24 * Math.pow(t, 1.42);
        pts.push(new THREE.Vector2(x, y));
    }
    pts.push(new THREE.Vector2(0, -1.64));
    return new THREE.LatheGeometry(pts, 128);
}
const sandMound = new THREE.Mesh(
    makeSandMoundGeometry(),
    new THREE.MeshPhysicalMaterial({
        color: 0xfffdf4,
        transparent: true,
        opacity: 0.12,
        roughness: 0.72,
        metalness: 0.0,
        sheen: 1.0,
        sheenColor: new THREE.Color(0xffffff),
        emissive: 0xfff2d2,
        emissiveIntensity: 0.035,
        depthWrite: false
    })
);
sandMound.renderOrder = 1;
hgGroup.add(sandMound);
let sandMesh = new THREE.InstancedMesh(sandGeo, sandMat, (maxSandCount + 500) * PARTICLES_PER_CELL);
sandMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
hgGroup.add(sandMesh);

const _mat4 = new THREE.Matrix4();
const _pos = new THREE.Vector3();
const _quat = new THREE.Quaternion();
const _scl = new THREE.Vector3(1, 1, 1);

function updateSandMesh() {
    let count = 0;
    for (let i = 0; i < n; i++) {
        if (!sand[i]) continue;
        const color = SAND_COL[clr[i]];
        const base = i * PARTICLES_PER_CELL * 3;
        for (let p = 0; p < PARTICLES_PER_CELL; p++) {
            const pi = base + p * 3;
            _pos.set(particlePos[pi], particlePos[pi + 1], particlePos[pi + 2]);
            _mat4.compose(_pos, _quat, _scl);
            sandMesh.setMatrixAt(count, _mat4);
            sandMesh.setColorAt(count, color);
            count++;
        }
    }
    sandMesh.count = count;
    sandMesh.instanceMatrix.needsUpdate = true;
    if (sandMesh.instanceColor) sandMesh.instanceColor.needsUpdate = true;
}
updateSandMesh();

// ── Sparkle Points ──
const SPARK_N = 30;
const sparkGeo2 = new THREE.BufferGeometry();
const sparkPos = new Float32Array(SPARK_N * 3);
const sparkSizes = new Float32Array(SPARK_N);
sparkGeo2.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3));
sparkGeo2.setAttribute('size', new THREE.BufferAttribute(sparkSizes, 1));
const sparkMat2 = new THREE.PointsMaterial({
    color: 0xffc8e8, size: 0.09, transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
});
const sparkPoints = new THREE.Points(sparkGeo2, sparkMat2);
hgGroup.add(sparkPoints);

function initSparks() {
    for (let i = 0; i < SPARK_N; i++) {
        const r = cRow + 3 + Math.random() * (gH - cRow - 6);
        const hw = hw2(Math.round(r));
        const offset = (Math.random() - 0.5) * hw;
        const r3d = radius3D(Math.round(r)) * 0.7;
        const x = (offset / (hw || 1)) * r3d;
        const zMax = Math.sqrt(Math.max(0, r3d * r3d - x * x));
        sparkPos[i * 3] = x;
        sparkPos[i * 3 + 1] = (0.5 - r / (gH - 1)) * HG_H;
        sparkPos[i * 3 + 2] = (Math.random() * 2 - 1) * zMax;
        sparkSizes[i] = 0.04 + Math.random() * 0.08;
    }
    sparkGeo2.attributes.position.needsUpdate = true;
}

// ── Sand Physics ──
function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
        const j = (Math.random() * (i + 1)) | 0;
        const t = a[i]; a[i] = a[j]; a[j] = t;
    }
}
function simStep() {
    mv.fill(0);
    for (let r = gH - 2; r >= 0; r--) {
        shuffle(colArr);
        for (let ci = 0; ci < gW; ci++) {
            const c = colArr[ci];
            const i = r * gW + c;
            if (!sand[i] || mv[i]) continue;
            const isGate = (r === cRow);
            if (isGate && neckFlowBudget < 1) continue;
            const b = i + gW;
            // 1) 직하 (똑바로 아래로)
            if (bnd[b] && !sand[b]) {
                sand[b] = 1; clr[b] = clr[i]; sand[i] = 0; mv[b] = 1;
                if (isGate) neckFlowBudget -= 1;
                continue;
            }
            // 2) 사선 슬라이드 — 가장 가까운 빈 셀로 1칸씩 미끄러져 정착 (중력 자연스러움).
            //    중앙에 먼저 쌓이고 위로 갈수록 좌우로 퍼지는 원뿔 모양이 됨.
            //    SLIDE_MAX는 step 1이 막혔을 때(funnel 벽으로 인해 bnd 밖) 더 안쪽 step까지
            //    탐색하기 위한 상한선이지, 무조건 멀리 점프하기 위한 게 아님.
            //    stream(위에 모래가 이어진 셀)은 1칸만.
            const isPileTop = r === 0 || !sand[i - gW];
            const onWall = !bnd[b];
            const slideMax = (isPileTop || onWall) ? SLIDE_MAX : 1;
            const d1 = Math.random() < 0.5 ? 1 : -1;
            for (const dirSign of [d1, -d1]) {
                let landDi = -1;
                for (let step = 1; step <= slideMax; step++) {
                    const nc = c + dirSign * step;
                    if (nc < 0 || nc >= gW) break;
                    // 같은 row의 경로 셀이 막혀있으면 더 못 굴러감
                    if (sand[r * gW + nc]) break;
                    const di = (r + 1) * gW + nc;
                    if (!bnd[di]) continue; // bnd 밖이면 건너뛰고 다음 step 탐색
                    if (!sand[di]) { landDi = di; break; } // 가장 가까운 빈 셀에 정착
                }
                if (landDi >= 0) {
                    sand[landDi] = 1; clr[landDi] = clr[i]; sand[i] = 0; mv[landDi] = 1;
                    if (isGate) neckFlowBudget -= 1;
                    break;
                }
            }
        }
    }
}
function flipGrid() {
    const ts = new Uint8Array(n), tc = new Uint8Array(n);
    for (let r = 0; r < gH; r++) {
        const mr = gH - 1 - r;
        for (let c = 0; c < gW; c++) {
            const si = r * gW + c, di = mr * gW + c;
            if (sand[si] && bnd[di]) { ts[di] = 1; tc[di] = clr[si]; }
        }
    }
    sand.set(ts); clr.set(tc);
}
function isDone() {
    for (let r = 0; r <= cRow; r++)
        for (let c = 0; c < gW; c++)
            if (sand[r * gW + c]) return false;
    return true;
}

// ── State Machine ──
// 탭/뒤집기는 항상 grid를 뒤집고 RUNNING으로 (재)시작 → 어떤 자세에서든 모래가 흐름
function doFlip() {
    if (flipAnim >= 0) return;
    if (state === 'COMPLETED') {
        fillBottom();
        sparkMat2.opacity = 0;
        warmLight.intensity = 1.4;
    }
    flipAnim = 0;
    state = 'RUNNING';
    t0 = Date.now();
    neckFlowBudget = 0;
    updateUI();
}

function updateUI() {
    statusEl.textContent = state === 'IDLE' ? '대기 중' : state === 'RUNNING' ? '진행 중' : '완료';
    statusEl.className = state === 'COMPLETED' ? 'done' : '';
    hintEl.textContent = hasOrient ? '폰을 뒤집거나 화면을 탭하세요' : '화면을 탭하여 뒤집기';
}

// ── Settings Panel ──
const panelBody = document.getElementById('panel-body');
panelBody.addEventListener('pointerdown', (e) => e.stopPropagation());
panelBody.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });

function rebuildSandMesh() {
    hgGroup.remove(sandMesh);
    sandMesh.dispose();
    sandMesh = new THREE.InstancedMesh(sandGeo, sandMat, (maxSandCount + 500) * PARTICLES_PER_CELL);
    sandMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    hgGroup.add(sandMesh);
}

document.getElementById('s-duration').addEventListener('input', (e) => {
    DURATION = +e.target.value;
    document.getElementById('v-duration').textContent = DURATION + 's';
    neckFlowPerSecond = totalSandCount / DURATION;
});
document.getElementById('s-sand').addEventListener('input', (e) => {
    SAND_FILL = (+e.target.value) / 100;
    document.getElementById('v-sand').textContent = (+e.target.value) + '%';
    fillBottom();
    totalSandCount = sand.reduce((a, b) => a + b, 0);
    neckFlowPerSecond = totalSandCount / DURATION;
    state = 'IDLE';
    neckFlowBudget = 0;
    sparkMat2.opacity = 0;
    warmLight.intensity = 1.4;
    updateUI();
});
document.getElementById('s-psize').addEventListener('input', (e) => {
    P_SIZE = (+e.target.value) / 10000;
    document.getElementById('v-psize').textContent = P_SIZE.toFixed(4);
    const oldGeo = sandGeo;
    sandGeo = new THREE.IcosahedronGeometry(P_SIZE, 0);
    sandMesh.geometry = sandGeo;
    oldGeo.dispose();
    // jitter spread도 입자 크기에 비례하므로 위치 재계산
    buildParticlePositions();
});
document.getElementById('s-ppc').addEventListener('input', (e) => {
    PARTICLES_PER_CELL = +e.target.value;
    document.getElementById('v-ppc').textContent = PARTICLES_PER_CELL;
    buildParticlePositions();
    rebuildSandMesh();
});
document.getElementById('s-slide').addEventListener('input', (e) => {
    SLIDE_MAX = +e.target.value;
    document.getElementById('v-slide').textContent = SLIDE_MAX;
});

// ── Events ──
renderer.domElement.addEventListener('pointerdown', (e) => { e.preventDefault(); doFlip(); });
renderer.domElement.addEventListener('touchstart', (e) => { e.preventDefault(); }, { passive: false });
document.addEventListener('touchmove', (e) => { e.preventDefault(); }, { passive: false });

function onOri(e) {
    if (e.beta == null) return;
    hasOrient = true;
    const f = e.beta < -30;
    if (f !== prevFlip) {
        prevFlip = f;
        // 폰을 거꾸로 뒤집은 순간에만 flip 트리거 (원위치 복귀로는 멈추지 않음)
        if (f) doFlip();
    }
}
if (window.DeviceOrientationEvent) {
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        renderer.domElement.addEventListener('pointerdown', function rp() {
            DeviceOrientationEvent.requestPermission()
                .then(r => { if (r === 'granted') window.addEventListener('deviceorientation', onOri); })
                .catch(() => {});
            renderer.domElement.removeEventListener('pointerdown', rp);
        });
    } else {
        window.addEventListener('deviceorientation', onOri);
    }
}

function onResize() {
    W = window.visualViewport?.width || window.innerWidth;
    H = window.visualViewport?.height || window.innerHeight;
    camera.aspect = W / H;
    camera.updateProjectionMatrix();
    renderer.setSize(W, H);
    composer.setSize(W, H);
    bloomPass.resolution.set(W * dpr, H * dpr);
}
window.addEventListener('resize', onResize);
window.visualViewport?.addEventListener('resize', onResize);
try { screen.orientation?.lock?.('portrait').catch(() => {}); } catch (e) {}

// ── Animation Loop ──
let prevTime = 0;
function animate(time) {
    const dt = Math.min((time - (prevTime || time)) / 1000, 0.1);
    prevTime = time;
    fc++;

    // Flip animation
    if (flipAnim >= 0) {
        flipAnim += dt / flipDur;
        if (flipAnim >= 1) {
            flipAnim = -1;
            flipGrid();
            hgGroup.rotation.x = 0;
        } else {
            const t = flipAnim;
            const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
            hgGroup.rotation.x = ease * Math.PI;
        }
    }

    // Sand simulation — 항상 돌림 (어떤 자세에서든 흐르도록).
    // 모래가 모두 바닥에 안착해 있으면 simStep은 아무것도 하지 않으므로 안전함.
    if (flipAnim < 0) {
        // dt 기반 누적 → 모든 frame rate(60/120Hz 등)에서 동일한 DURATION 보장
        neckFlowBudget = Math.min(neckFlowBudget + neckFlowPerSecond * dt, 3);
        for (let i = 0; i < STEPS; i++) simStep();
        if (state === 'RUNNING' && fc % 20 === 0 && isDone()) {
            state = 'COMPLETED'; tDone = Date.now();
            initSparks();
            sparkMat2.opacity = 0.9;
            try { navigator.vibrate?.(200); } catch (e) {}
            updateUI();
        }
    }

    // Completion → reset
    if (state === 'COMPLETED') {
        const elapsed = Date.now() - tDone;
        const pulse = Math.sin(elapsed * 0.006) * 0.4 + 0.5;
        sparkMat2.opacity = pulse;
        warmLight.intensity = 1.4 + pulse * 0.8;
        if (elapsed > DONE_DELAY) {
            state = 'IDLE'; fillBottom(); sparkMat2.opacity = 0;
            warmLight.intensity = 1.4;
            updateUI();
        }
    } else {
        sparkMat2.opacity = 0;
    }

    // Update sand mesh
    updateSandMesh();

    // Timer UI
    if (state === 'RUNNING' || state === 'COMPLETED') {
        const e = ((state === 'COMPLETED' ? tDone : Date.now()) - t0) / 1000;
        timerEl.textContent = `${(e / 60) | 0}:${String((e % 60) | 0).padStart(2, '0')}`;
    } else {
        timerEl.textContent = '';
    }

    // Twinkle background stars + pulse moon glow
    const tw = time * 0.001;
    bgStarMat.opacity = 0.7 + Math.sin(tw * 1.4) * 0.15;
    bgStarMat.size = 0.07 + Math.sin(tw * 0.7) * 0.012;
    moonMat.opacity = 0.78 + Math.sin(tw * 0.8) * 0.14;
    moonSprite.scale.setScalar(0.6 + Math.sin(tw * 0.6) * 0.025);
    upperGlow.material.opacity = 0.005;
    aquaLight.intensity = 0.35 + Math.sin(tw * 1.4) * 0.08;
    innerGlow.color.setHSL(0.12 + Math.sin(tw * 0.35) * 0.04, 0.85, 0.70);
    innerGlow.intensity = 0.8;
    dustPoints.rotation.y = 0;
    dustMat.opacity = 0.14;
    bloomPass.strength = 0.32;
    hgGroup.rotation.z = 0;
    camera.position.x = 0.15;
    camera.position.y = 0.15;
    camera.lookAt(0, 0, 0);

    composer.render();
    requestAnimationFrame(animate);
}

updateUI();
requestAnimationFrame(animate);
</script>
</body>
</html>
