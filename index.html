<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>모래시계</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; height: 100dvh;
            overflow: hidden; position: fixed; top: 0; left: 0;
            background:
                radial-gradient(ellipse 60% 22% at 50% 56%, rgba(92,224,255,0.16) 0%, transparent 58%),
                radial-gradient(ellipse 78% 24% at 36% 89%, rgba(255,175,210,0.48) 0%, transparent 60%),
                radial-gradient(ellipse 68% 20% at 78% 94%, rgba(255,150,196,0.35) 0%, transparent 58%),
                radial-gradient(ellipse 90% 18% at 50% 102%, rgba(255,218,190,0.38) 0%, transparent 65%),
                linear-gradient(180deg, #173f6a 0%, #235b88 22%, #327aa1 45%, #5d8eaa 66%, #8f8fb0 82%, #d19aad 100%);
            touch-action: none; user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body::before {
            content: ''; position: fixed; inset: 0; pointer-events: none;
            background:
                linear-gradient(104deg, transparent 30%, rgba(168,228,255,0.10) 40%, rgba(224,255,248,0.12) 47%, rgba(255,220,200,0.10) 56%, transparent 68%),
                radial-gradient(circle at 50% 47%, transparent 0%, transparent 42%, rgba(12,28,64,0.18) 78%, rgba(8,12,28,0.34) 100%),
                linear-gradient(180deg, rgba(255,255,255,0.08) 0%, transparent 22%, rgba(40,90,130,0.12) 100%);
            mix-blend-mode: screen;
        }
        body::after {
            content: ''; position: fixed; inset: 0; pointer-events: none;
            background-image:
                radial-gradient(circle, rgba(255,255,255,0.9) 1px, transparent 1.5px),
                radial-gradient(circle, rgba(255,240,200,0.7) 0.8px, transparent 1.5px),
                radial-gradient(circle, rgba(220,230,255,0.6) 0.6px, transparent 1.2px);
            background-size: 280px 280px, 190px 190px, 130px 130px;
            background-position: 40px 70px, 160px 30px, 90px 180px;
            opacity: 0.72;
        }
        #grain {
            position: fixed; inset: 0; pointer-events: none; z-index: 2;
            opacity: 0.11;
            background-image:
                repeating-radial-gradient(circle at 12% 18%, rgba(255,255,255,0.18) 0 0.7px, transparent 0.8px 2.4px),
                repeating-linear-gradient(78deg, rgba(255,255,255,0.05) 0 1px, transparent 1px 4px);
            background-size: 180px 180px, 220px 220px;
            mix-blend-mode: soft-light;
        }
        canvas { display: block; position: fixed; top: 0; left: 0; touch-action: none; }
        #ui {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
            display: flex; flex-direction: column; align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        #status {
            margin-top: 40px; color: rgba(245,235,210,0.75);
            font-size: 12px; font-weight: 600; letter-spacing: 2px;
            text-shadow: 0 1px 4px rgba(40,40,80,0.5);
        }
        #status.done { color: rgba(255,230,170,0.95); }
        #timer {
            margin-top: 8px; color: rgba(255,240,210,0.85);
            font-size: 24px; font-weight: 300;
            font-family: ui-monospace, 'SF Mono', monospace;
            min-height: 30px;
            text-shadow: 0 1px 4px rgba(40,40,80,0.5);
        }
        #hint {
            position: fixed; bottom: 32px; left: 0; width: 100%;
            text-align: center; color: rgba(240,225,210,0.55);
            font-size: 11px;
            text-shadow: 0 1px 4px rgba(40,40,80,0.4);
        }
        #panel {
            position: fixed; top: 14px; right: 14px; z-index: 20;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: rgba(245,235,215,0.9);
            display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
        }
        #panel-toggle {
            display: none; /* 데스크탑: 숨김 (패널 상시 표시) */
            width: 42px; height: 42px;
            border: 1px solid rgba(255,225,170,0.3);
            border-radius: 50%;
            background: rgba(18,35,62,0.45);
            backdrop-filter: blur(12px) saturate(140%);
            -webkit-backdrop-filter: blur(12px) saturate(140%);
            color: rgba(255,225,170,0.95);
            font-size: 20px; line-height: 1;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(20,25,60,0.4);
            transition: transform 0.25s ease, background 0.2s ease;
        }
        #panel-toggle:hover { background: rgba(40,60,100,0.55); }
        #panel.open #panel-toggle { transform: rotate(60deg); }
        @media (max-width: 768px) {
            #panel-toggle { display: block; }
            #panel-body { display: none; }
            #panel.open #panel-body { display: block; }
        }
        #panel-body {
            padding: 16px 18px;
            border-radius: 16px;
            background: rgba(18,35,62,0.28);
            backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%);
            box-shadow: 0 4px 24px rgba(20,25,60,0.35), inset 0 0 0 1px rgba(180,245,255,0.18);
            min-width: 250px;
        }
        #panel-body label {
            display: block; font-size: 11px; font-weight: 600;
            letter-spacing: 1px; margin-bottom: 14px;
        }
        #panel-body label:last-child { margin-bottom: 0; }
        #panel-body .row {
            display: flex; justify-content: space-between; align-items: baseline;
            margin-bottom: 6px;
        }
        #panel-body .val {
            font-family: ui-monospace, 'SF Mono', monospace;
            font-weight: 400; font-size: 11px;
            color: rgba(255,225,170,0.95); letter-spacing: 0;
        }
        #panel-body .name { display: flex; align-items: center; gap: 6px; }
        #panel-body .lock {
            border: none; background: none; padding: 0;
            width: 16px; height: 16px; line-height: 1;
            font-size: 11px; cursor: pointer;
            color: rgba(245,235,215,0.4);
            transition: color 0.2s ease;
        }
        #panel-body .lock:hover { color: rgba(255,225,170,0.8); }
        #panel-body .lock.locked { color: rgba(255,210,150,0.95); }
        #panel-body label.locked .val { color: rgba(245,235,215,0.4); }
        #panel-body label.locked input[type=range] {
            opacity: 0.4; cursor: not-allowed;
        }
        #panel-body .presets { display: flex; gap: 6px; margin-top: 8px; }
        #panel-body .preset {
            flex: 1; padding: 5px 0;
            border: 1px solid rgba(255,225,170,0.22);
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            color: rgba(245,235,215,0.85);
            font-family: inherit; font-size: 10px; font-weight: 600; letter-spacing: 0.3px;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }
        #panel-body .preset:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,225,170,0.4); }
        #panel-body .preset.active { background: rgba(255,210,150,0.2); border-color: rgba(255,225,170,0.55); color: #fff; }
        #panel-body label.locked .preset { opacity: 0.4; cursor: not-allowed; pointer-events: none; }
        #panel-body input[type=range] {
            width: 100%; accent-color: rgba(255,210,150,0.95);
            cursor: pointer;
        }
        #panel-body .rotate-buttons {
            display: flex; gap: 8px; margin-bottom: 14px;
        }
        #panel-body .rotate-buttons button {
            flex: 1;
            padding: 10px 6px;
            border: 1px solid rgba(255,225,170,0.25);
            border-radius: 10px;
            background: rgba(255,255,255,0.06);
            color: rgba(245,235,215,0.9);
            font-family: inherit; font-size: 11px; font-weight: 600; letter-spacing: 0.5px;
            white-space: nowrap;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }
        #panel-body .rotate-buttons button:hover {
            background: rgba(255,255,255,0.12);
            border-color: rgba(255,225,170,0.45);
        }
        #panel-body .rotate-buttons button.active {
            background: rgba(255,210,150,0.22);
            border-color: rgba(255,225,170,0.6);
            color: #fff;
        }
    </style>
</head>
<body>
<div id="ui">
    <div id="status">대기 중</div>
    <div id="timer"></div>
    <div id="hint">화면을 탭하여 뒤집기</div>
</div>
<div id="grain"></div>
<div id="panel">
    <button id="panel-toggle" type="button" aria-label="설정 패널">⚙</button>
    <div id="panel-body">
        <div class="rotate-buttons">
            <button id="b-rot-left" type="button">↺ 좌 90°</button>
            <button id="b-rot-right" type="button">우 90° ↻</button>
        </div>
        <div class="rotate-buttons">
            <button id="b-reset-angle" type="button">⟲ 각도 초기화</button>
            <button id="b-reset-panel" type="button">⟲ 초기 세팅으로</button>
        </div>
        <label id="l-duration">
            <div class="row"><span class="name"><button type="button" class="lock" id="lk-time" aria-label="총 시간 잠금">🔓</button>총 시간</span><span class="val" id="v-duration">60s</span></div>
            <input type="range" min="2" max="120" step="1" value="60" id="s-duration">
            <div class="presets">
                <button type="button" class="preset" data-sec="30">30초</button>
                <button type="button" class="preset" data-sec="60">1분</button>
                <button type="button" class="preset" data-sec="120">2분</button>
            </div>
        </label>
        <label id="l-sand">
            <div class="row"><span class="name"><button type="button" class="lock" id="lk-sand" aria-label="모래 양 잠금">🔓</button>모래 양</span><span class="val" id="v-sand">100%</span></div>
            <input type="range" min="10" max="100" step="5" value="100" id="s-sand">
        </label>
        <label>
            <div class="row"><span>입자 크기</span><span class="val" id="v-psize">0.0070</span></div>
            <input type="range" min="20" max="200" step="1" value="70" id="s-psize">
        </label>
        <label>
            <div class="row"><span>셀당 입자 수</span><span class="val" id="v-ppc">10</span></div>
            <input type="range" min="1" max="20" step="1" value="10" id="s-ppc">
        </label>
        <label>
            <div class="row"><span>안식각 (slide)</span><span class="val" id="v-slide">3</span></div>
            <input type="range" min="1" max="6" step="1" value="3" id="s-slide">
        </label>
        <label id="l-neck">
            <div class="row"><span class="name"><button type="button" class="lock" id="lk-neck" aria-label="목 굵기 잠금">🔓</button>목 굵기</span><span class="val" id="v-neck">2</span></div>
            <input type="range" min="1" max="6" step="1" value="2" id="s-neck">
        </label>
    </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
